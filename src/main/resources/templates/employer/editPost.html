<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Job</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="w-2/3 mx-auto mt-6 bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4 text-center">Edit Job Posting</h2>

    <form th:action="@{/jobs/edit/{id}(id=${job.jobId})}"
          th:object="${job}"
          method="post"
          class="space-y-4">

        <div>
            <label class="block font-medium">Job Title</label>
            <input type="text" th:field="*{jobTitle}"
                   class="w-full border rounded p-2" required>
        </div>

        <div>
            <label class="block font-medium">Description</label>
            <textarea th:field="*{description}"
                      class="w-full border rounded p-2" required></textarea>
        </div>

        <div>
            <label class="block font-medium">Location</label>
            <input type="text" th:field="*{location}"
                   class="w-full border rounded p-2" required>
        </div>

        <div>
            <label class="block font-medium">Salary</label>
            <input type="number" th:field="*{salary}"
                   class="w-full border rounded p-2" required>
        </div>

        <div>
            <label class="block font-medium">Category</label>
            <input type="text" th:field="*{category}"
                   class="w-full border rounded p-2" required>
        </div>

        <div>
            <label class="block font-medium">Deadline</label>
            <input type="date" th:field="*{deadline}"
                   class="w-full border rounded p-2" required>
        </div>

        <div class="flex justify-between">
            <a th:href="@{/dashboard}"
               class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
                Cancel
            </a>

            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Update Job
            </button>
        </div>
    </form>
</div>

</body>
</html>
