<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create New Job</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex justify-center items-start pt-10">

<div class="bg-white p-8 rounded-lg shadow-md w-3/4 max-w-2xl">
    <h1 class="text-2xl font-bold mb-6">Create New Job Posting</h1>

    <!-- Success/Error Messages -->
    <div th:if="${error}" class="bg-red-100 text-red-800 p-3 rounded mb-4">
        <p th:text="${error}"></p>
    </div>
    <div th:if="${success}" class="bg-green-100 text-green-800 p-3 rounded mb-4">
        <p th:text="${success}"></p>
    </div>

    <form th:action="@{/dashboard/newPost}" th:object="${posting}" method="post" class="max-w-xl mx-auto p-6 bg-white shadow-md rounded-md space-y-4">

        <h2 class="text-2xl font-semibold mb-4 text-center">Post a New Job</h2>

        <!-- Job Title -->
        <div>
            <label class="block font-medium mb-1">Job Title</label>
            <input type="text" th:field="*{JobTitle}" placeholder="Enter job title"
                   class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-yellow-500"/>
        </div>

        <!-- Description -->
        <div>
            <label class="block font-medium mb-1">Description</label>
            <textarea th:field="*{Description}" placeholder="Job description" rows="4"
                      class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
        </div>

        <!-- Location -->
        <div>
            <label class="block font-medium mb-1">Location</label>
            <input type="text" th:field="*{Location}" placeholder="Job location"
                   class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-yellow-500"/>
        </div>

        <!-- Salary -->
        <div>
            <label class="block font-medium mb-1">Salary</label>
            <input type="number" th:field="*{Salary}" placeholder="Salary in $"
                   class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-yellow-500"/>
        </div>

        <!-- Category -->
        <div>
            <label class="block font-medium mb-1">Category</label>
            <select th:field="*{Category}"
                    class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                <option value="" disabled selected>Select category</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Design">Design</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Deadline -->
        <div>
            <label class="block font-medium mb-1">Deadline</label>
            <input type="date" th:field="*{deadline}"
                   class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-yellow-500"/>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
            <button type="submit"
                    class="bg-yellow-500 text-white px-6 py-2 rounded-md hover:bg-yellow-600 transition-colors">
                Post Job
            </button>
        </div>

    </form>

</div>

</body>
</html>
