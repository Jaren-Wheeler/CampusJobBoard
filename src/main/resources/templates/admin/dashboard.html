<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <!-- Shared head -->
    <th:block th:replace="fragments/_shared/head :: head"></th:block>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center">

<div class="bg-white w-full max-w-5xl rounded-xl shadow-lg p-10">

    <!-- Header -->
    <h1 class="text-3xl font-semibold text-[#2A3810] mb-2">
        Admin Dashboard
    </h1>
    <p class="text-gray-500 mb-8">
        Review and manage job postings submitted by employers.
    </p>

    <!-- Placeholder panel -->
    <div class="border border-dashed border-gray-300 rounded-lg p-6 mb-6">
        <p class="text-lg font-medium text-gray-700">
            Job moderation coming soon
        </p>
        <p class="text-gray-500 mt-1">
            This dashboard will allow administrators to approve or reject
            job postings once employers submit them.
        </p>
    </div>

    <!-- Table skeleton -->
    <div class="overflow-x-auto">
        <table class="w-full border-collapse">
            <thead>
            <tr class="border-b text-gray-600 text-sm">
                <th class="text-left py-3 px-2">Job Title</th>
                <th class="text-left py-3 px-2">Employer</th>
                <th class="text-left py-3 px-2">Category</th>
                <th class="text-left py-3 px-2">Status</th>
                <th class="text-left py-3 px-2">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr class="text-gray-400">
                <td class="py-4 px-2" colspan="5">
                    No pending job postings available.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
